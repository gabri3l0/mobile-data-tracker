[project]
name = "mobile-data-tracker"
version = "0.1.0"
description = "A mobile carrier API client for retrieving and parsing data usage"
requires-python = ">=3.11"
# Logging uses Python's standard library; no additional dependency is required.
dependencies = [
    "fastapi>=0.143.3",
    "httpx>=0.28,<0.29",
    "python-dotenv>=1,<2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mobile_data_tracker"]
